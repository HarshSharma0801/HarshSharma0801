name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: HarshSharma0801
          config_timezone: Asia/Kolkata
          committer_message: "chore: update metrics"
          template: classic
          base: header, activity, community, repositories
          
          # Include private contributions
          repositories_affiliations: owner, collaborator, organization_member
          repositories_batch: 100
          
          # Languages and coding activity
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 60
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 1000
          plugin_languages_recent_days: 365

          # Activity and contributions
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Habits and coding patterns (includes private repos)
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_from: 1000
          plugin_habits_days: 30
          plugin_habits_trim: yes

          # Lines of code changed
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          
          # Code review and PR stats
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes

          # Achievements
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_limit: 10

          # Hide zero-value sections
          repositories_forks: no
          use_prebuilt_image: yes
